
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free Word Counter</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f4f7fb;
  color: #222;
}

.container {
  max-width: 700px;
  margin: 50px auto;
  padding: 25px;
}

.box {
  background: white;
  padding: 30px;
  border-radius: 15px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
}

h1 {
  text-align: center;
  margin-bottom: 10px;
}

.subtitle {
  text-align: center;
  color: #666;
  margin-bottom: 25px;
}

textarea {
  width: 100%;
  height: 250px;
  padding: 15px;
  box-sizing: border-box;
  border: 1px solid #ccc;
  border-radius: 10px;
  font-size: 16px;
  resize: vertical;
}

.stats {
  display: flex;
  justify-content: space-around;
  margin-top: 20px;
  text-align: center;
}

.stat {
  font-size: 18px;
}

.number {
  display: block;
  font-size: 28px;
  font-weight: bold;
}

button {
  display: block;
  margin: 25px auto 0;
  padding: 12px 25px;
  border: none;
  border-radius: 8px;
  background: #222;
  color: white;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  opacity: 0.85;
}

@media (max-width: 600px) {
  .container {
    margin: 20px auto;
    padding: 15px;
  }

  .box {
    padding: 20px;
  }

  textarea {
    height: 220px;
  }
}
</style>
</head>

<body>

<div class="container">
  <div class="box">

    <h1>Word Counter</h1>

    <p class="subtitle">
      Count words and characters instantly for free.
    </p>

    <textarea id="text" placeholder="Type or paste your text here..."></textarea>

    <div class="stats">
      <div class="stat">
        <span class="number" id="words">0</span>
        Words
      </div>

      <div class="stat">
        <span class="number" id="characters">0</span>
        Characters
      </div>
    </div>

    <button onclick="clearText()">Clear Text</button>

  </div>
</div>

<script>
const text = document.getElementById("text");

text.addEventListener("input", function() {
  const value = text.value.trim();

  const words = value === "" ? 0 : value.split(/\s+/).length;
  const characters = text.value.length;

  document.getElementById("words").textContent = words;
  document.getElementById("characters").textContent = characters;
});

function clearText() {
  text.value = "";
  document.getElementById("words").textContent = "0";
  document.getElementById("characters").textContent = "0";
}
</script>
<div style="text-align:center; margin-top:30px;">
  <a href="about.html">About</a> |
  <a href="contact.html">Contact</a> |
  <a href="privacy.html">Privacy Policy</a>
</div>

</body>
</html>
